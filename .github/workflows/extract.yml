name: Extract ZIP

on:
  push:
    paths:
      - '*.zip'
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Remove old extracted folder
        run: rm -rf extracted

      - name: Extract main zip to root
        run: unzip -o pkg_otplogin-1.0.0.zip -d .

      - name: Extract nested packages to root
        run: |
          cd packages
          for f in *.zip; do
            [ -f "$f" ] || continue
            unzip -o "$f" -d ..
          done

      - name: Remove all zip files
        run: |
          rm -f pkg_otplogin-1.0.0.zip
          rm -f packages/*.zip
          rmdir packages 2>/dev/null || true

      - name: Commit extracted files
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Extract all packages to root" || echo "no changes"
          git push
