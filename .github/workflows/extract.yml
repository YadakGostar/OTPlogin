name: Extract ZIP

on:
  push:
    paths:
      - '*.zip'
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract main zip
        run: unzip -o pkg_otplogin-1.0.0.zip -d extracted/

      - name: Commit extracted files
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add extracted/
          git commit -m "Auto-extract plugin source" || echo "no changes"
          git push
