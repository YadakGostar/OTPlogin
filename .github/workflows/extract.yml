name: Extract ZIP

on:
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clean everything except README and workflow
        run: |
          find . -mindepth 1 -maxdepth 1 ! -name '.git' ! -name '.github' ! -name 'README.md' -exec rm -rf {} +

      - name: Get original zip from history
        run: |
          git checkout $(git log --all --oneline --diff-filter=D -- pkg_otplogin-1.0.0.zip | head -1 | cut -d' ' -f1)^ -- pkg_otplogin-1.0.0.zip 2>/dev/null || echo "not found"

      - name: Extract main zip to temp
        run: |
          mkdir -p _tmp
          unzip -o pkg_otplogin-1.0.0.zip -d _tmp
          mv _tmp/* .
          rm -rf _tmp pkg_otplogin-1.0.0.zip

      - name: Extract nested packages
        run: |
          cd packages
          unzip -o com_otplogin.zip -d ../com_otplogin
          unzip -o mod_otplogin.zip -d ../mod_otplogin
          unzip -o plg_authentication_otplogin.zip -d ../plg_authentication_otplogin
          unzip -o plg_user_otploginavatar.zip -d ../plg_user_otploginavatar
          cd ..
          rm -rf packages

      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Clean and extract properly" || echo "no changes"
          git push
