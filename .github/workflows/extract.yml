name: Extract ZIP

on:
  push:
    paths:
      - '*.zip'
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Remove old extracted folder
        run: rm -rf extracted

      - name: Extract main zip to root
        run: unzip -o pkg_otplogin-1.0.0.zip -d .

      - name: Commit extracted files
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add .
          git commit -m "Extract plugin source to root" || echo "no changes"
          git push
